name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly drift scan against new rule/CA/CVE data.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep (Reptar rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep==1.182.1

      - name: Validate Reptar rules and regression fixtures
        run: |
          semgrep scan --config .semgrep --validate --strict
          semgrep scan --test --config .semgrep/reptar.yaml .semgrep/reptar.cs
          python3 scripts/test-security-gates.py

      # Validate rules strictly, but report target-parser limitations separately:
      # Semgrep's C# parser does not yet fully support .NET 10 file directives
      # or every primary-constructor form. CodeQL also compiles the affected apps.
      # Findings gate by severity:
      # ERROR/WARNING fail the job, INFO findings are advisory (surfaced as
      # annotations). Rules target application code (templates/, examples/,
      # apps/) — framework internals legitimately use the audited escape
      # hatches.
      - name: Scan with Reptar security rules
        run: |
          semgrep scan --config .semgrep --json --output semgrep-results.json
          python3 scripts/check-semgrep.py semgrep-results.json

      - name: Preserve Semgrep findings and parser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: ignore

  codeql:
    name: CodeQL (csharp)
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp

      # Manual build (no solution file at the repo root): building the test
      # project compiles the full framework dependency graph for tracing.
      - name: Build framework
        run: |
          dotnet build framework/Reptar.Tests/Reptar.Tests.csproj
          dotnet build examples/agent-cli/app.cs
          dotnet build examples/baas/app.cs
          dotnet build examples/campfire/app.cs
          dotnet build examples/switchyard/app.cs

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  dependency-audit:
    name: Dependency audit (NuGet + Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: NuGet vulnerability audit
        run: |
          fail=0
          for proj in $(find . -name "*.csproj" \
              -not -path "*/obj/*" \
              -not -path "*/bin/*" \
              -not -path "*/node_modules/*" \
              -not -path "*/artifacts/*" \
              -not -path "*/spikes/*" \
              -not -path "*/templates/*"); do
            # Unexpanded scaffolds refer to unpublished package placeholders;
            # their rendered project references are exercised by scaffold E2E.
            # `dotnet list --vulnerable` alone exits 0 even when advisories exist.
            if ! dotnet restore "$proj" --force-evaluate \
                -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low \
                -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904,NU1905; then
              echo "::error file=${proj}::NuGet restore/audit failed (including advisory-data failures)"
              fail=1
            fi
          done
          exit $fail

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install the locked workspace
        run: bun install --frozen-lockfile

      - name: Bun lockfile audit
        run: bun audit --production
