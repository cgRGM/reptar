name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify framework, scaffold, and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reptar_test
          POSTGRES_USER: reptar
          POSTGRES_PASSWORD: reptar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reptar -d reptar_test" --health-interval 5s --health-timeout 5s --health-retries 10

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: reptar_test
          MYSQL_USER: reptar
          MYSQL_PASSWORD: reptar
          MYSQL_ROOT_PASSWORD: reptar
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ureptar -preptar" --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Cache Bun and NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.nuget/packages
            .reptar/sdk
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-dotnet-10.0.401
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production dependency audit
        run: bun audit --production

      - name: Lint source
        run: bunx oxlint

      # Fail fast on cross-platform native renderer / Markdown issues.
      - name: Documentation site build
        run: |
          bun run build
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/llms-small.txt
          test -f dist/index.md
          test -f dist/client/codegen.md
          test -f dist/overview/release-benchmarks.md
        working-directory: apps/docs

      - name: Documentation markdown actions check
        run: bun run check:markdown
        working-directory: apps/docs

      - name: Initialize local SQLite database
        run: bun reptar db migrate

      # Run sequentially: parallel test/self-check runs share bin/obj and can
      # flake in one checkout (see plans/phase1-remediation-log.md).
      - name: Framework tests
        run: bun reptar test

      - name: Host boundary and CLI regression tests
        run: bun test packages/host/src packages/rpc/src/client.test.ts scripts/diff-composite.test.ts scripts/inspect-db.test.ts apps/docs/worker/index.test.ts bench/load scripts/testing

      - name: Benchmark evidence TypeScript contracts
        run: |
          bunx tsc --ignoreConfig --noEmit --target ESNext --module ESNext --moduleResolution Bundler \
            --typeRoots packages/rpc/node_modules/@types,node_modules/@types --types bun \
            --strict --resolveJsonModule --esModuleInterop --skipLibCheck bench/load/*.ts

      - name: Staging bundle and scoped lifecycle negative controls (no remote apply)
        run: |
          python3 scripts/test-staging-bundle.py
          python3 scripts/test-staging-unit.py
          python3 -m py_compile scripts/test-staged-native.py scripts/staging-unit.py scripts/build-staging-bundle.py
          bunx tsc --ignoreConfig --noEmit --target ESNext --module ESNext --moduleResolution Bundler \
            --typeRoots packages/rpc/node_modules/@types,node_modules/@types --types bun \
            --strict --skipLibCheck --allowImportingTsExtensions packages/infra/reliability.run.ts

      - name: Rebuild all deployed Worker artifacts
        run: |
          bun reptar build:worker
          bun reptar build:realworld
          bun reptar build:worker:rooms

      - name: Host contract and artifact hashes
        run: bun reptar check:host

      - name: Worker size budget
        run: bun reptar check:worker

      - name: Provider matrix (SQLite, Postgres, MySQL, D1)
        env:
          POSTGRES_TEST: "1"
          POSTGRES_URL: "Host=127.0.0.1;Port=5432;Database=reptar_test;Username=reptar;Password=reptar"
          MYSQL_TEST: "1"
          MYSQL_URL: "Server=127.0.0.1;Port=3306;Database=reptar_test;User ID=reptar;Password=reptar;"
        run: bun run test:providers --require-all

      - name: NetWasm compatibility lint
        run: bun reptar check:netwasm --strict

      - name: Architecture boundary
        run: bun scripts/check-architecture.ts --strict

      - name: Build optional AI packages
        run: dotnet build framework/Reptar.AI.Gateway/Reptar.AI.Gateway.csproj

      - name: Build file-based AI examples
        run: |
          dotnet build examples/agent-cli/app.cs
          dotnet build examples/ai-gateway/app.cs

      - name: AOT warning gate negative controls
        run: python3 scripts/test-aot-warning-gate.py

      - name: Published Native AOT metadata and binding contracts
        run: |
          set -o pipefail
          dotnet publish scripts/fixtures/aot-contracts/aot-contracts.csproj -c Release -r linux-x64 --self-contained \
            -p:PublishAot=true -p:DebugType=None -p:DebugSymbols=false \
            -o "$RUNNER_TEMP/reptar-aot-contracts-native" 2>&1 | tee "$RUNNER_TEMP/reptar-aot-contracts-publish.log"
          python3 scripts/test-aot-contracts.py "$RUNNER_TEMP/reptar-aot-contracts-native/app"

      - name: Published Native AOT agent offline smoke
        run: |
          set -o pipefail
          dotnet publish examples/agent-cli/app.cs -c Release -r linux-x64 --self-contained \
            -p:PublishAot=true -p:DebugType=None -p:DebugSymbols=false \
            -o "$RUNNER_TEMP/reptar-agent-native" 2>&1 | tee "$RUNNER_TEMP/reptar-agent-publish.log"
          python3 scripts/test-agent-native.py "$RUNNER_TEMP/reptar-agent-native/app"

      - name: Published Native AOT HTTP boundary and stream fault smoke
        run: |
          set -o pipefail
          dotnet publish scripts/fixtures/native-boundaries/app.cs -c Release -r linux-x64 --self-contained \
            -p:PublishAot=true -p:DebugType=None -p:DebugSymbols=false \
            -o "$RUNNER_TEMP/reptar-http-native" 2>&1 | tee "$RUNNER_TEMP/reptar-http-publish.log"
          python3 scripts/test-native-boundaries.py "$RUNNER_TEMP/reptar-http-native/app"

      - name: Published Native AOT session crash and concurrent-process durability
        run: |
          set -o pipefail
          dotnet publish scripts/fixtures/session-durability/app.cs -c Release -r linux-x64 --self-contained \
            -p:PublishAot=true -p:DebugType=None -p:DebugSymbols=false \
            -o "$RUNNER_TEMP/reptar-session-native" 2>&1 | tee "$RUNNER_TEMP/reptar-session-publish.log"
          python3 scripts/test-session-durability.py "$RUNNER_TEMP/reptar-session-native/app"

      - name: Published Native AOT queue and cron shutdown lifecycle
        run: |
          set -o pipefail
          dotnet publish scripts/fixtures/background-lifecycle/app.cs -c Release -r linux-x64 --self-contained \
            -p:PublishAot=true -p:DebugType=None -p:DebugSymbols=false \
            -o "$RUNNER_TEMP/reptar-background-native" 2>&1 | tee "$RUNNER_TEMP/reptar-background-publish.log"
          python3 scripts/test-background-lifecycle.py "$RUNNER_TEMP/reptar-background-native/app"

      - name: Publish Native AOT Rooms for the two-host realtime gate
        run: |
          set -o pipefail
          dotnet publish examples/realtime-rooms/app.cs -c Release -r linux-x64 --self-contained \
            -p:PublishAot=true -p:DebugType=None -p:DebugSymbols=false \
            -o "$RUNNER_TEMP/reptar-rooms-native" 2>&1 | tee "$RUNNER_TEMP/reptar-rooms-publish.log"

      - name: Published Native AOT Rooms persistence fault boundaries
        run: |
          set -o pipefail
          dotnet publish scripts/fixtures/realtime-faults/app.cs -c Release -r linux-x64 --self-contained \
            -p:PublishAot=true -p:DebugType=None -p:DebugSymbols=false \
            -o "$RUNNER_TEMP/reptar-rooms-faults-native" 2>&1 | tee "$RUNNER_TEMP/reptar-rooms-faults-publish.log"
          python3 scripts/test-realtime-faults.py "$RUNNER_TEMP/reptar-rooms-faults-native/app"

      - name: Reviewed Native AOT diagnostic instances
        run: |
          python3 scripts/check-aot-warnings.py \
            "$RUNNER_TEMP/reptar-aot-contracts-publish.log" \
            "$RUNNER_TEMP/reptar-agent-publish.log" \
            "$RUNNER_TEMP/reptar-http-publish.log" \
            "$RUNNER_TEMP/reptar-session-publish.log" \
            "$RUNNER_TEMP/reptar-background-publish.log" \
            "$RUNNER_TEMP/reptar-rooms-publish.log" \
            "$RUNNER_TEMP/reptar-rooms-faults-publish.log"

      - name: Doctor (strict)
        run: bun reptar doctor --strict

      - name: Two-host realtime smoke
        run: REPTAR_ROOMS_NATIVE_BINARY="$RUNNER_TEMP/reptar-rooms-native/app" bun reptar test:realtime

      - name: Scaffold end-to-end
        run: bun scripts/test-scaffold.ts

      - name: Generated contracts typecheck
        run: bun rpc:check

      - name: RPC package typecheck
        run: bunx tsc --noEmit -p packages/rpc

      - name: create-reptar typecheck
        run: |
          cd packages/create-reptar
          bun run check-types

      - name: Native AOT published-artifact gate
        run: bash examples/switchyard/test-native.sh

      - name: Operational harness success, budget and owner-stop controls (not elapsed proving)
        run: |
          set -euo pipefail
          container=""
          trap 'if [[ -n "$container" ]]; then docker rm "$container"; fi' EXIT
          container=$(docker create --name "reptar-reliability-extract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" reptar-switchyard:verify)
          mkdir "$RUNNER_TEMP/reptar-operational-switchyard"
          docker cp "$container:/app/." "$RUNNER_TEMP/reptar-operational-switchyard/"
          docker rm "$container"
          container=""
          python3 scripts/test-operational-soak-harness.py \
            --switchyard "$RUNNER_TEMP/reptar-operational-switchyard/reptar" \
            --rooms "$RUNNER_TEMP/reptar-rooms-native/app" \
            --agent "$RUNNER_TEMP/reptar-agent-native/app" \
            --bun "$(command -v bun)"

      - name: Pinned prior native application upgrade and same-schema backup rollback
        timeout-minutes: 10
        run: |
          set -euo pipefail
          previous=0be66d9d61d14765608fe654106fb03363a6be7b
          git fetch --no-tags origin "$previous"
          prior="$RUNNER_TEMP/reptar-reliability-prior-source"
          mkdir "$prior"
          git archive "$previous" | tar -x -C "$prior"
          for app in switchyard agent-cli; do
            (
              cd "$prior"
              dotnet publish "examples/$app/app.cs" -c Release -r linux-x64 --self-contained \
                -p:PublishAot=true -p:DebugType=None -p:DebugSymbols=false \
                -o "$RUNNER_TEMP/reptar-prior-$app-native"
            ) 2>&1 | tee "$RUNNER_TEMP/reptar-prior-$app-publish.log"
            test ! -e "$RUNNER_TEMP/reptar-prior-$app-native/app.dll"
            if grep -Ei 'will always throw|warning IL2104|warning IL3053' "$RUNNER_TEMP/reptar-prior-$app-publish.log"; then
              exit 1
            fi
          done
          python3 scripts/test-native-upgrade.py \
            --previous-switchyard "$RUNNER_TEMP/reptar-prior-switchyard-native/app" \
            --previous-agent "$RUNNER_TEMP/reptar-prior-agent-cli-native/app" \
            --current-switchyard "$RUNNER_TEMP/reptar-operational-switchyard/reptar" \
            --current-agent "$RUNNER_TEMP/reptar-agent-native/app" \
            --previous-source-commit "$previous" --bun "$(command -v bun)"
          if python3 scripts/test-native-upgrade.py \
            --previous-switchyard "$RUNNER_TEMP/reptar-operational-switchyard/reptar" \
            --previous-agent "$RUNNER_TEMP/reptar-agent-native/app" \
            --current-switchyard "$RUNNER_TEMP/reptar-operational-switchyard/reptar" \
            --current-agent "$RUNNER_TEMP/reptar-agent-native/app" \
            --previous-source-commit "$previous" --bun "$(command -v bun)" \
            > "$RUNNER_TEMP/reptar-false-upgrade-negative.log" 2>&1; then
            echo 'False previous-version control unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'Supplied previous artifacts are identical to current' "$RUNNER_TEMP/reptar-false-upgrade-negative.log"

      - name: Documentation snippet check
        run: bun run docs:check:snippets

      - name: Generated API reference drift check
        run: |
          bun reptar codegen
          # Compare the same canonical formatting enforced by pre-commit.
          bunx oxfmt --write apps/docs/src/content/docs/api/
          git diff --exit-code apps/docs/src/content/docs/api/

      - name: Package verified native artifacts without runtime data or credentials
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          destination = temp / 'reptar-reliability-native-linux'
          destination.mkdir()
          sources = {
              'switchyard': (temp / 'reptar-operational-switchyard', 'reptar'),
              'rooms': (temp / 'reptar-rooms-native', 'app'),
              'agent': (temp / 'reptar-agent-native', 'app'),
          }
          hashes = {}
          for name, (source, executable) in sources.items():
              target = destination / name
              target.mkdir()
              for original, filename in ((executable, 'app'), ('libe_sqlite3.so', 'libe_sqlite3.so')):
                  shutil.copy2(source / original, target / filename)
                  hashes[f'{name}/{filename}'] = hashlib.sha256((target / filename).read_bytes()).hexdigest()
          image_id = subprocess.check_output(['docker', 'image', 'inspect', 'reptar-switchyard:verify', '--format', '{{.Id}}'], text=True).strip()
          assert image_id.startswith('sha256:'), 'Require the actual tested image identity, not an unrelated image version'
          manifest = {
              'sourceBuildCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'reviewedHeadCommit': os.environ['REVIEWED_HEAD'],
              'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'hostDotnetVersion': subprocess.check_output(['dotnet', '--version'], text=True).strip(),
              'switchyardBuildToolchain': 'Docker SDK stage; see actual build log, not inferred from host SDK',
              'verifiedSwitchyardImageId': image_id, 'rid': 'linux-x64', 'sha256': hashes,
              'limits': ['Native artifacts only, not a deployment or elapsed proving result', 'Restore executable permission after artifact download', 'Review build/head/tree provenance before staging', 'CI image ID is not a pullable runtime base digest; pin and validate the staging runtime separately'],
          }
          (destination / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY

      - name: Retain verified native artifact bundle for bounded isolated proving
        uses: actions/upload-artifact@v4
        with:
          name: reptar-reliability-native-linux-${{ github.run_id }}
          path: ${{ runner.temp }}/reptar-reliability-native-linux/
          retention-days: 3
          if-no-files-found: error
