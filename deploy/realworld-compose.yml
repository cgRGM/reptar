services:
  realworld:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_DIR: examples/realworld
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - REALWORLD_DB=/tmp/realworld.db
      - REALWORLD_JWT_SECRET=reptar-realworld-vps-secret
